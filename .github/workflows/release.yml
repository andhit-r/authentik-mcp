name: Release

# Berjalan saat tag versi (vMAJOR.MINOR.PATCH) di-push.
# Membuat GitHub Release otomatis dan mem-publish image ke GHCR.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # untuk membuat GitHub Release
  packages: write # untuk push image ke GHCR

jobs:
  # Jalankan ulang test di dalam Docker sebelum rilis sebagai pengaman.
  test:
    name: Unit Test (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t authentik-mcp:test .

      - name: Run pytest
        run: docker run --rm authentik-mcp:test pytest

  github-release:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buat release dari tag menggunakan gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  docker-image:
    name: Build & Publish Image (GHCR)
    needs: test
    # Caller tipis ke reusable workflow bersama; image multi-arch untuk node SBC ARM.
    # ghcr.yml@v2 meminta contents: read + packages: write; permissions tingkat atas
    # di atas sudah memuat keduanya (jangan dipindah ke tingkat job).
    uses: andhit-r/release-docker-image-ghcr/.github/workflows/ghcr.yml@v2
    with:
      dockerfile: Dockerfile
      target: runtime
      platforms: linux/amd64,linux/arm64
    secrets: inherit
